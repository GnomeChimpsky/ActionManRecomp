format_version = 5
id = "amx.enhancement.widescreen"
version = "1.2.0"
name = "Action Man Widescreen"
author = "ActionManRecomp"
description = "Renders Action Man: Operation Extreme with a wider field of view (16:9, 21:9 or following the window), keeping the HUD at its original proportions."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00887"
disc_sha256 = "9709f7473f00405efe4952d5318057c3256eca807cdc202b19736769bef66b20"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Enable widescreen rendering and choose a fixed or resize-driven aspect."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Adaptive follows the live window size from 4:3 through 21:9."
group = "Display"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[plugin]]
feature = "widescreen"
id = "amx.widescreen.16-9"
when = { aspect = "16:9" }

[[plugin]]
feature = "widescreen"
id = "amx.widescreen.21-9"
when = { aspect = "21:9" }

[[plugin]]
feature = "widescreen"
id = "amx.widescreen.adaptive"
when = { aspect = "adaptive" }
