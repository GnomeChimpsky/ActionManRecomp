format_version = 5
id = "amx.enhancement.frame-rate"
version = "1.0.0"
name = "Action Man Frame Rate"
author = "ActionManRecomp"
description = "Intermediate frames rendered with the game's own drawing code, with 3D positions placed between the game's frames. Game logic, timers and audio keep their stock cadence. Requires OpenGL."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLES-01761"
disc_sha256 = "6ec5784d3a359595083284fafe663f642dc68f801793a331dd478414f22ee341"

[[feature]]
id = "interpolated-rendering"
name = "Interpolated Rendering"
description = "Redraw the scene between the game's 25 fps frames with interpolated geometry and camera, without speeding up gameplay. Use instead of Settings > Smooth motion."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "interpolated-rendering"
# Not "rate": that id held the 0.4.4 choices (display, 60 ... 240), and a
# saved value that is no longer a choice would stop the mods resolving.
id = "fps"
label = "Presentation rate"
description = "50 FPS adds one in-between per 25 fps game frame and is the smoothest; 100 FPS adds three and needs a faster GPU. The game simulation is untouched. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "50"

[[option.choice]]
value = "50"
label = "50 FPS (Recommended)"

[[option.choice]]
value = "100"
label = "100 FPS"

[[plugin]]
feature = "interpolated-rendering"
id = "amx.framerate.50"
when = { fps = "50" }

[[plugin]]
feature = "interpolated-rendering"
id = "amx.framerate.100"
when = { fps = "100" }
